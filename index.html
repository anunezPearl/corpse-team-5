<!DOCTYPE html>
<html>
<head>
  <title>ALL CAPS DRAMA Converter</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; text-align: center; }
    input { font-size: 1.2rem; padding: 8px; width: 250px; }
    button { font-size: 1.2rem; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>ALL CAPS DRAMA Converter</h1>
  <p>Type something to dramatize.</p>
  <input id="textInput" type="text" placeholder="Type here" />
  <button onclick="dramatize()">DRAMATIZE</button>
  <div id="output" style="margin-top: 20px; font-weight: bold;"></div>

  <script>
    function dramatize() {
      const val = document.getElementById('textInput').value;
      document.getElementById('output').innerText = val.toUpperCase();
      // Works minimally already! Build me further — add exclamation points, random drama words, etc.
    }
  </script>
</body>
</html>
